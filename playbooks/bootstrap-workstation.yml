---
- name: Bootstrap workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ssh_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh"
    bootstrap_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/booststap"

  tasks:
    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: "{{ ssh_dir }}"
        state: directory
        mode: "0700"

    - name: Write Homelab Hosts Key (id_ed25519)
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.pipe', 'op read \"op://homelab/Homelab Hosts Key/private key?ssh-format=openssh\"') }}\n"
        dest: "{{ ssh_dir }}/id_ed25519"
        mode: "0600"

    - name: Write Home Assistant SSH Key (homelab_ha)
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.pipe', 'op read \"op://homelab/Home Assistant SSH Key/private key?ssh-format=openssh\"') }}\n"
        dest: "{{ ssh_dir }}/homelab_ha"
        mode: "0600"

    - name: Deploy shared bash aliases
      ansible.builtin.copy:
        src: "{{ bootstrap_dir }}/files/bashrc"
        dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.bash_aliases"
        mode: "0644"
